-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   id="menubar-z-inactive-outline"
   width="20"
   height="20">
  <g transform="matrix(1.25,0,0,-1.25,0,20)">
    <path
       d="m 0.5,11.5 9,0 0,-2 -4,-5 4,0 0,-3 -9,0 0,2 4,5 -4,0 z"
       style="fill:none;stroke:#4EC9E8;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-opacity:1" />
    <path
       d="m 11.5,12.5 0,2 6,0 0,-2 -3,-3 3,0 0,-2 -6,0 0,2 3,3 z"
       style="fill:none;stroke:#4EC9E8;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-opacity:1" />
  </g>
</svg>
